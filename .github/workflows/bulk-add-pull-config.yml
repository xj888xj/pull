name: Bulk add wei/pull pull.yml to all forks
run-name: bulk add pull.yml
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  add-config:
    runs-on: ubuntu-24
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gh & jq
        run: |
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | gpg --dearmor -o /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          apt update && apt install gh jq -y

      - name: Run bulk script
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_USER: xj888xj
          DRY_RUN: "true"
          FILE_PATH: ".github/pull.yml"
          COMMIT_MSG: "feat: add wei/pull sync config"
          YAML_B64: "dmVyc2lvbjogIjEiCnJ1bGVzOgogIC0gYmFzZTogbWFzdGVyCiAgICB1cHN0cmVhbTogbWFzdGVyCiAgICBtZXJnZU1ldGhvZDogaGFyZHJlc2V0CiAgICBhdXRvTWVyZ2U6IGZhbHNlCiAgICBsYWJlbHM6CiAgICAgIC0gc3luYy11cHN0cmVhbQogICAgdGl0bGU6ICJwdWxsOiBzeW5jIHVwc3RyZWFtIG1hc3RlciIK"
        run: |
          set -eo pipefail
          echo "Fetch all forks of user: $GH_USER"

          gh auth login --with-token <<< "$GH_TOKEN"

          REPO_LIST=$(gh repo list "$GH_USER" --fork --no-archived --json name,defaultBranchRef,fullName --limit 200)

          echo "$REPO_LIST" | jq -c '.[]' | while read -r repo; do
            FULL_NAME=$(echo "$repo" | jq -r '.fullName')
            DEF_BRANCH=$(echo "$repo" | jq -r '.defaultBranchRef.name')
            echo -e "\n👉 Repo: $FULL_NAME | default branch: $DEF_BRANCH"

            set +e
            SHA=$(gh api "repos/$FULL_NAME/contents/$FILE_PATH?ref=$DEF_BRANCH" -q '.sha' 2>/dev/null)
            set -e

            if [[ -n "$SHA" && "$SHA" != "null" ]]; then
              echo "✅ File exists, skip"
              continue
            fi

            echo "📝 Prepare create $FILE_PATH"
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "🧪 DRY RUN, skip commit"
              continue
            fi

            gh api -X PUT "repos/$FULL_NAME/contents/$FILE_PATH" \
              -f message="$COMMIT_MSG" \
              -f content="$YAML_B64" \
              -f branch="$DEF_BRANCH"
            echo "✅ Committed to $FULL_NAME"
          done

          echo -e "\n=== Finished ==="
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "💡 This was dry-run, change DRY_RUN to false to apply real changes"
          fi
